# echo DPO — base 路线 · Mac/CPU 代码验证配置 (无量化，小 batch，~20 步)
# 仅验证代码路径能跑通，不追求训练效果。
#
# Mac 注意：
#   - merged-base 是 ~3GB bf16 权重，Mac 16GB 内存足够加载
#   - 不开 bnb 量化（Mac 无 bitsandbytes）
#   - 用 adamw_torch 替代 paged_adamw_8bit

model:
  model_path: "checkpoints/merged-base"

quantization:
  enabled: false

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

data:
  train_file: "data/dpo/train.jsonl"
  val_file: "data/dpo/val.jsonl"

training:
  seed: 42
  max_length: 256                # 短序列加速验证
  beta: 0.1
  loss_type: "sigmoid"
  num_epochs: 1
  per_device_batch_size: 1
  grad_accum_steps: 1
  learning_rate: 5.0e-6
  lr_scheduler: "cosine"
  warmup_ratio: 0.1
  optim: "adamw_torch"           # Mac 无 paged_adamw_8bit
  bf16: false                    # Mac CPU 用 fp32
  fp16: false
  logging_steps: 5
  eval_strategy: "no"
  save_strategy: "no"
  save_total_limit: 1
  max_steps: 20                  # 只跑 20 步验证代码
  max_grad_norm: 1.0
  gradient_checkpointing: false
  num_workers: 0
  report_to: "none"
  output_dir: "checkpoints/dpo-tiny-base"
