# echo SFT — Win RTX 3060 12GB 生产配置 (QLoRA)
#
# epoch=2 与 8g 版同步：instruct 底座已对齐，只需轻量风格漂移；
# 实测 base 路线 5 epoch 严重过拟合（详见 Doc/Reading/sft-mode-collapse-findings/README.md），
# instruct 保守起步，训完按 stepshooting §5.6 抽测调整

model:
  model_id: "Qwen/Qwen2.5-1.5B-Instruct"

quantization:
  enabled: true
  quant_type: "nf4"
  compute_dtype: "bfloat16"
  double_quant: true

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

data:
  train_file: "data/sft/train.jsonl"
  val_file: "data/sft/val.jsonl"

training:
  seed: 42
  max_seq_length: 2048
  num_epochs: 2
  per_device_batch_size: 4
  grad_accum_steps: 4        # effective batch = 4 * 4 = 16
  learning_rate: 2.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  optim: "paged_adamw_8bit"
  bf16: true
  fp16: false
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 250            # 加密便于抽测找 sweet spot
  save_total_limit: 12
  max_steps: -1              # -1 = 按 epochs 走
  gradient_checkpointing: false
  num_workers: 2
  report_to: "none"
  output_dir: "checkpoints/sft"
