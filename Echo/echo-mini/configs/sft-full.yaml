# echo-mini SFT — Win RTX 3060 12GB 生产配置

model:
  vocab_size: 16384
  d_model: 512
  n_layers: 16
  n_heads: 8
  n_kv_heads: 4
  d_ff: 1376
  max_seq_len: 1024
  dropout: 0.0
  rope_theta: 10000.0

sft_data:
  train_jsonl: "data/sft/train.jsonl"
  alpaca_en_samples: 10000
  alpaca_zh_samples: 10000
  max_chars_per_sample: 2000

training:
  seed: 42
  mixed_precision: "bf16"
  batch_size: 8
  grad_accum_steps: 4          # effective batch = 8 * 4 = 32 seqs
  max_steps: 3000
  peak_lr: 2.0e-5
  min_lr: 2.0e-6
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  warmup_steps: 100
  max_grad_norm: 1.0
  log_interval: 10
  save_interval: 500
  num_workers: 2
  ckpt_dir: "checkpoints/sft"
  pretrain_ckpt: "checkpoints/pretrain/step_010000.pt"

tokenizer_path: "tokenizer/tokenizer.json"
