# echo-mini pretrain — Mac/CPU tiny 验证配置 (~100 步快速通跑)

model:
  vocab_size: 16386
  d_model: 512
  n_layers: 16
  n_heads: 8
  n_kv_heads: 4
  d_ff: 1376
  max_seq_len: 1024
  rope_theta: 10000.0

data:
  train_bin: "data/bin/train.bin"
  # download 阶段参数 (极小量)
  fineweb_docs: 500
  wiki_zh_docs: 300
  skypile_docs: 200

training:
  seed: 42
  mixed_precision: "no"        # CPU/MPS 不用 bf16
  batch_size: 4
  grad_accum_steps: 1
  max_steps: 100
  peak_lr: 3.0e-4
  min_lr: 3.0e-5
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  warmup_steps: 5
  max_grad_norm: 1.0
  log_interval: 5
  save_interval: 50
  num_workers: 0
  ckpt_dir: "checkpoints/pretrain"

tokenizer_path: "tokenizer/tokenizer.json"
