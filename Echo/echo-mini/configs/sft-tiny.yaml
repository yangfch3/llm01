# echo-mini SFT — Mac/CPU 验证配置 (~100 步)

model:
  vocab_size: 16386
  d_model: 512
  n_layers: 16
  n_heads: 8
  n_kv_heads: 4
  d_ff: 1376
  max_seq_len: 512
  rope_theta: 10000.0

sft_data:
  train_jsonl: "data/sft/train.jsonl"
  alpaca_en_samples: 200
  alpaca_zh_samples: 200
  max_chars_per_sample: 1000

training:
  seed: 42
  mixed_precision: "no"
  batch_size: 2
  grad_accum_steps: 1
  max_steps: 100
  peak_lr: 2.0e-5
  min_lr: 2.0e-6
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  warmup_steps: 10
  max_grad_norm: 1.0
  log_interval: 10
  save_interval: 50
  num_workers: 0
  ckpt_dir: "checkpoints/sft"
  pretrain_ckpt: "checkpoints/pretrain/step_010000.pt"

tokenizer_path: "tokenizer/tokenizer.json"
