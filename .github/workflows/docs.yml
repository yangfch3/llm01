name: Deploy MkDocs to Pages

on:
  push:
    branches: [main]
    paths:
      - 'Doc/**'
      - 'Misc/mkdocs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Misc/mkdocs
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: Misc/mkdocs/requirements-docs.txt

      - name: Install deps
        run: |
          uv venv .venv-docs
          uv pip install --python .venv-docs -r requirements-docs.txt

      - name: Build site
        run: .venv-docs/bin/mkdocs build --strict --site-dir _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Misc/mkdocs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
