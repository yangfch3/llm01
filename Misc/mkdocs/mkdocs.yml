site_name: LLM 0-1
site_description: LLM 0-1 — 从数学基础到部署
site_url: https://yangfch3.github.io/llm01/
repo_url: https://github.com/yangfch3/llm01
repo_name: yangfch3/llm01

dev_addr: '0.0.0.0:8000'

docs_dir: ../../Doc

theme:
  name: material
  custom_dir: overrides
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换亮色模式
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - search.highlight
    - toc.follow

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yangfch3/llm01
      name: GitHub 仓库
