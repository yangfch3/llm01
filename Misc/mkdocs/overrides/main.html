{% extends "base.html" %}

{% block extrahead %}
<style>
/* 隐藏侧栏导航中根目录生成的顶层 section 标题 */
.md-nav--primary > .md-nav__title {
  display: none;
}
.md-sidebar--primary .md-nav__list .md-nav__item {
  margin-top: 0;
}
.md-main__inner {
  margin-top: 0.5rem;
}
code, kbd, pre {
  font-family: "Monaspace Neon", ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Roboto Mono", "Liberation Mono", Menlo, monospace !important;
}
</style>
<script>
window.MathJax = {
  tex: {
    inlineMath: [["\\(", "\\)"]],
    displayMath: [["\\[", "\\]"]],
    processEscapes: true,
    processEnvironments: true
  },
  options: {
    ignoreHtmlClass: ".*|",
    processHtmlClass: "arithmatex"
  },
  startup: {
    ready: function() {
      MathJax.startup.defaultReady();
      document$.subscribe(function() {
        MathJax.startup.output.clearCache();
        MathJax.typesetClear();
        MathJax.typeset();
      });
    }
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
{% endblock %}
