[project]
name = "llm01"
version = "0.0.0"
description = "LLM 入门课件 + Echo 对话模型双线产出"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# ---- 模块维度 ----
courseware = [
    "torch>=2.2",
    "numpy>=1.26",
    "matplotlib",
    "jupyter",
    "ipykernel",
    "pyyaml",
    "tqdm",
    "rich",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-awesome-pages-plugin",
]

echo-mini = [
    "torch>=2.2",
    "transformers>=4.36",
    "tokenizers",
    "datasets>=2.16",
    "accelerate>=0.25",
    "peft>=0.7",
    "trl>=0.7",
    "safetensors",
    "huggingface-hub",
    "sentencepiece>=0.2",
    "pyyaml",
    "tqdm",
    "rich",
]

echo = [
    "torch>=2.2",
    "transformers>=4.36",
    "tokenizers",
    "datasets>=2.16",
    "accelerate>=0.25",
    "peft>=0.7",
    "trl>=0.7",
    "safetensors",
    "huggingface-hub",
    "sentencepiece>=0.2",
    "pyyaml",
    "tqdm",
    "rich",
]

# ---- 平台维度 ----
train-cuda = [
    "bitsandbytes>=0.43; sys_platform == 'win32' or sys_platform == 'linux'",
]

train-mps = [
    # 暂无强制额外依赖，留扩展位
]

# ---- 部署 ----
# deploy: 通用部署工具（当前留空，预留 ollama python client 等跨平台轻量依赖）
deploy = []

# deploy-llamacpp: llama-cpp-python，Win 下可能需要本地 MSVC + CMake 编译
# M6 部署阶段再按需安装：
#   uv sync --extra deploy-llamacpp
# Win 编译失败时考虑预编译 wheel：
#   https://github.com/abetlen/llama-cpp-python/releases
deploy-llamacpp = [
    "llama-cpp-python",
]

# ---- 开发工具 ----
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    "checkpoints",
    "data",
    "runs",
]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear, SIM: simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # 行长由 formatter 控
    "B008",  # 教学代码常用默认值
]

[tool.ruff.lint.per-file-ignores]
"Playground/**" = ["F401", "F841"]  # 教学代码允许未使用的 import / 局部变量
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Echo/shared"]

# ---- uv: 按平台分流 PyTorch wheel 源 ----
# Win/Linux 用 cu124（CUDA 12.4），Mac 用默认 PyPI（自带 MPS 支持）
[tool.uv]
conflicts = [
    [
        { extra = "train-cuda" },
        { extra = "train-mps" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
