<style>
:root {
  --bg: #f9f7f4;
  --surface: #ffffff;
  --border: #e5e0da;
  --accent: #c96442;
  --accent-light: #f4e8e2;

  background: var(--bg);

<body>
<a href="/llm01" class="back-link">&larr; 返回主站</a>
<h1>LLM 显存占用估算器</h1>
<p class="subtitle">纯公式估算，判断量级是否合理。部分流程实测峰值通常 3~7× 于本表，不用于预测 OOM 边界。<span class="legend"> <span>红色</span> = 超出显存红线</span></p>

<div class="filters">
  <div class="filter-group">
    <label>模型规模</label>
    <div class="multi-select" id="model-select"></div>
  </div>
  <div class="filter-group">
    <label>精度</label>
    <div class="multi-select" id="precision-select"></div>
  </div>
  <div class="filter-group">
    <label>Batch Size</label>
    <select id="bs-select"></select>
  </div>
  <div class="filter-group">
    <label>序列长度</label>
    <select id="seq-select"></select>
  </div>
  <div class="filter-group">
    <label>LoRA Rank</label>
    <select id="lora-rank-select"></select>
  </div>
  <div class="filter-group">
    <label>词表大小</label>
    <select id="vocab-select"></select>
  </div>
  <div class="filter-group">
    <label>显存红线</label>
    <select id="vram-limit-select"></select>
  </div>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;">
  <div class="tabs" id="tabs"></div>
  <button class="help-btn" id="help-btn" title="查看计算公式">?</button>
</div>
<div class="table-wrap" id="table-wrap"></div>

<!-- Help modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title"></span>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
// === Model configs ===
const MODEL_CONFIGS = {
  '1B':  { params: 1e9,  layers: 24, hidden: 2048, heads: 16 },
  '3B':  { params: 3e9,  layers: 32, hidden: 3200, heads: 32 },
  '7B':  { params: 7e9,  layers: 32, hidden: 4096, heads: 32 },
  '13B': { params: 13e9, layers: 40, hidden: 5120, heads: 40 },
  '34B': { params: 34e9, layers: 48, hidden: 6656, heads: 52 },
  '70B': { params: 70e9, layers: 80, hidden: 8192, heads: 64 },
};

const PRECISIONS = ['FP32', 'FP16/BF16', 'INT8', 'INT4'];
const BYTES_MAP = { FP32: 4, 'FP16/BF16': 2, INT8: 1, INT4: 0.5 };

const BS_OPTIONS = [1, 2, 4, 8, 16, 32, 64];
const SEQ_OPTIONS = [512, 1024, 2048, 4096, 8192];
const LORA_RANK_OPTIONS = [8, 16, 32, 64, 128];
const VRAM_LIMIT_OPTIONS = [8, 12, 16, 24, 48, 80];
// 词表大小：32k = LLaMA/Mistral 通用，128k = LLaMA3，151k = Qwen2/Qwen2.5
const VOCAB_OPTIONS = [
  { value: 32000,  label: '32k (LLaMA/Mistral)' },
  { value: 128000, label: '128k (LLaMA3)' },
  { value: 151936, label: '151k (Qwen2)' },
];

const DEFAULT_MODELS = ['1B', '7B'];
const DEFAULT_PRECISIONS = [...PRECISIONS];

// === State ===
let selectedModels = [...DEFAULT_MODELS];
let selectedPrecisions = [...DEFAULT_PRECISIONS];
let batchSize = 1;
let seqLen = 2048;
let loraRank = 16;
let vocabSize = 32000;
let vramLimit = 12;
let activeTab = 0;

const TABS = ['Pretrain', 'SFT', '对齐 (DPO)', '部署 (推理)'];

// === Init UI ===
function initChips(containerId, options, defaults, stateKey) {
  const container = document.getElementById(containerId);
  options.forEach(opt => {
    const chip = document.createElement('span');
    chip.className = 'chip' + (defaults.includes(opt) ? ' active' : '');
    chip.textContent = opt;
    chip.onclick = () => {
      chip.classList.toggle('active');
      if (stateKey === 'models') {
        selectedModels = [...container.querySelectorAll('.chip.active')].map(c => c.textContent);
      } else {
        selectedPrecisions = [...container.querySelectorAll('.chip.active')].map(c => c.textContent);
      }
      render();
    };
    container.appendChild(chip);
  });
}

function initSelect(id, options, defaultVal, setter, suffix) {
  const sel = document.getElementById(id);
  options.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = suffix ? v + suffix : v;
    if (v === defaultVal) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = () => { setter(Number(sel.value)); render(); };
}

function initTabs() {
  const container = document.getElementById('tabs');
  TABS.forEach((name, i) => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (i === 0 ? ' active' : '');
    tab.textContent = name;
    tab.onclick = () => { activeTab = i; updateTabUI(); render(); };
    container.appendChild(tab);
  });
}

function updateTabUI() {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', i === activeTab);
  });
}

// === Calculation ===
function toGB(bytes) { return bytes / (1024 ** 3); }

function modelWeight(params, precision) {
  return params * BYTES_MAP[precision];
}

// Activation memory estimation (simplified)
// ≈ 2 * bs * seq * hidden * layers * bytes_per_act (FP16 in AMP, else same as weight precision)
function activationMem(cfg, bs, seq, actBytes) {
  return 2 * bs * seq * cfg.hidden * cfg.layers * actBytes;
}

function kvCache(cfg, bs, seq) {
  // 2 (K+V) * layers * 2 * head_dim * seq * bs, stored in FP16
  const headDim = cfg.hidden / cfg.heads;
  return 2 * cfg.layers * cfg.heads * headDim * seq * bs * 2;
}

const NA = null; // marks invalid combination

function calcPretrain(modelKey, precision) {
  const cfg = MODEL_CONFIGS[modelKey];
  const P = cfg.params;
  const bpp = BYTES_MAP[precision];

  // INT8/INT4 cannot do conventional pretraining
  if (precision === 'INT8' || precision === 'INT4') {
    return { 'Naive': NA, '+ AMP': NA, '+ Grad Ckpt': NA, '+ AMP + Grad Ckpt': NA };
  }

  const isHalf = (precision === 'FP16/BF16');

  // Naive: weight + grad + optimizer(AdamW: fp32 copy + m + v = 12 bytes/param) + activation
  const naive_w = P * bpp;
  const naive_grad = P * bpp;
  const naive_opt = P * 12; // AdamW always FP32
  const naive_act = activationMem(cfg, batchSize, seqLen, bpp);
  const naive = naive_w + naive_grad + naive_opt + naive_act;

  // AMP only meaningful when base is FP32 (FP32 → BF16 mixed)
  const amp_w = P * 2;
  const amp_grad = P * 2;
  const amp_opt = P * 12;
  const amp_act = activationMem(cfg, batchSize, seqLen, 2);
  const amp = amp_w + amp_grad + amp_opt + amp_act;

  // Grad Ckpt: activation * 0.3
  const gc_act_factor = 0.3;
  const naive_gc = naive_w + naive_grad + naive_opt + naive_act * gc_act_factor;
  const amp_gc = amp_w + amp_grad + amp_opt + amp_act * gc_act_factor;

  return {
    'Naive': toGB(naive),
    '+ AMP': isHalf ? NA : toGB(amp),               // already half → AMP meaningless
    '+ Grad Ckpt': toGB(naive_gc),
    '+ AMP + Grad Ckpt': isHalf ? NA : toGB(amp_gc), // same
  };
}

function calcSFT(modelKey, precision) {
  const cfg = MODEL_CONFIGS[modelKey];
  const P = cfg.params;
  const bpp = BYTES_MAP[precision];
  // LoRA trainable params: 2 (down+up) * target_modules (q,v = 2) * layers * hidden * rank
  const loraParams = 2 * 2 * cfg.layers * cfg.hidden * loraRank;
  const isHalf = (precision === 'FP16/BF16');
  const isQuant = (precision === 'INT8' || precision === 'INT4');

  // Full + AMP + Grad Ckpt (most common full-param SFT) — only FP32 base makes sense
  const full_w = P * 2;
  const full_grad = P * 2;
  const full_opt = P * 12;
  const full_act = activationMem(cfg, batchSize, seqLen, 2) * 0.3;
  const full = full_w + full_grad + full_opt + full_act;

  // LoRA: frozen weight at selected precision + LoRA FP16 trained
  const lora_w = P * bpp; // frozen base
  const lora_grad = loraParams * 2;
  const lora_opt = loraParams * 12;
  const lora_act = activationMem(cfg, batchSize, seqLen, 2) * 0.3;
  const lora = lora_w + lora_grad + lora_opt + lora_act;

  // LoRA + AMP: only meaningful when base is FP32
  const lora_amp_w = P * 2;
  const lora_amp = lora_amp_w + lora_grad + lora_opt + lora_act;

  // QLoRA: always INT4 base + LoRA FP16, independent of precision selection
  const qlora_w = P * 0.5;
  const qlora = qlora_w + lora_grad + lora_opt + lora_act;

  return {
    'Full (AMP+Grad Ckpt)': isQuant ? NA : (isHalf ? toGB(full) : toGB(full)), // FP32/BF16/FP16 ok; INT8/4 N/A
    'LoRA': isQuant ? NA : toGB(lora),          // INT quantized base + LoRA not standard
    'LoRA + AMP': (isHalf || isQuant) ? NA : toGB(lora_amp), // only FP32 base
    'QLoRA': toGB(qlora),                        // always valid (fixed INT4 base)
  };
}

function calcAlign(modelKey, precision) {
  const cfg = MODEL_CONFIGS[modelKey];
  const P = cfg.params;
  const bpp = BYTES_MAP[precision];
  const loraParams = 2 * 2 * cfg.layers * cfg.hidden * loraRank;
  const isQuant = (precision === 'INT8' || precision === 'INT4');

  // Reference model (frozen, inference only) = weight at selected precision
  const ref_w = P * bpp;

  // DPO 单步 forward chosen + rejected 两份 → 激活 ×2
  const dpo_act = activationMem(cfg, batchSize, seqLen, 2) * 0.3 * 2;
  // DPO 输出 logits [2×bs, seq, vocab] fp32（chosen+rejected 各一份），大词表下是显存大头
  const dpo_logits = 2 * batchSize * seqLen * vocabSize * 4;

  // Full DPO: train model (full AMP+Grad Ckpt) + ref model — not possible with INT quantized weights
  const train_w = P * 2;
  const train_grad = P * 2;
  const train_opt = P * 12;
  const full = train_w + train_grad + train_opt + dpo_act + dpo_logits + ref_w;

  // LoRA DPO: single base + LoRA adapter, ref = disable adapter (no extra weight)
  const lora_w = P * bpp;
  const lora_grad = loraParams * 2;
  const lora_opt = loraParams * 12;
  const lora = lora_w + lora_grad + lora_opt + dpo_act + dpo_logits;

  // QLoRA DPO: INT4 base + LoRA, ref = disable adapter (no extra weight)
  const qlora_w = P * 0.5;
  const qlora = qlora_w + lora_grad + lora_opt + dpo_act + dpo_logits;

  return {
    'Full (含 ref)': isQuant ? NA : toGB(full),
    'LoRA (含 ref)': isQuant ? NA : toGB(lora),
    'QLoRA (含 ref)': toGB(qlora),  // always valid
  };
}

function calcDeploy(modelKey, precision) {
  const cfg = MODEL_CONFIGS[modelKey];
  const P = cfg.params;
  const bpp = BYTES_MAP[precision];

  const w = P * bpp;
  const kv = kvCache(cfg, batchSize, seqLen);
  const total = w + kv;

  return {
    '模型权重': toGB(w),
    'KV Cache': toGB(kv),
    '总计': toGB(total),
  };
}

// === Render ===
function render() {
  const calcFn = [calcPretrain, calcSFT, calcAlign, calcDeploy][activeTab];
  const wrap = document.getElementById('table-wrap');

  if (selectedModels.length === 0 || selectedPrecisions.length === 0) {
    wrap.innerHTML = '<p style="padding:20px;color:var(--text-dim)">请至少选择一个模型规模和一个精度。</p>';
    return;
  }

  // Get columns from first valid calculation
  const sampleResult = calcFn(selectedModels[0], selectedPrecisions[0]);
  const columns = Object.keys(sampleResult);

  let html = '<table><thead><tr><th>模型 / 精度</th>';
  columns.forEach(c => { html += `<th>${c}</th>`; });
  html += '</tr></thead><tbody>';

  selectedModels.forEach(model => {
    selectedPrecisions.forEach(prec => {
      const result = calcFn(model, prec);
      html += `<tr><td>${model} / ${prec}</td>`;
      columns.forEach(col => {
        const val = result[col];
        if (val === null) {
          html += `<td style="color:var(--text-dim);font-style:italic;">N/A</td>`;
        } else {
          const isOver = val > vramLimit;
          html += `<td class="${isOver ? 'over-12 warn-cell' : ''}">${val.toFixed(1)} GB</td>`;
        }
      });
      html += '</tr>';
    });
  });

  html += '</tbody></table>';
  wrap.innerHTML = html;
}

// === Help Modal ===
const HELP_CONTENT = [
  // Pretrain
  `<p><b>Pretrain 显存估算公式</b></p>
<pre>显存 = 权重 + 梯度 + 优化器状态 + 激活

权重      = P × bytes_per_param
梯度      = P × bytes_per_param
优化器    = P × 12 bytes (AdamW: FP32副本 + m + v)
激活      ≈ 2 × bs × seq_len × hidden × layers × act_bytes</pre>
<p><b>各列含义：</b></p>
<p><code>Naive</code> — 原始精度全量训练，无任何优化</p>
<p><code>+ AMP</code> — 混合精度：前向/激活用 FP16，梯度+优化器保持 FP32（仅 FP32 基础有意义）</p>
<p><code>+ Grad Ckpt</code> — 梯度检查点：丢弃中间激活，反向时重算，激活显存 ×0.3</p>
<p><code>+ AMP + Grad Ckpt</code> — 两者叠加，最省显存的全参训练方式</p>`,

  // SFT
  `<p><b>SFT 显存估算公式</b></p>
<pre>Full (AMP+Grad Ckpt):
  显存 = P×2 + P×2 + P×12 + 激活×0.3

LoRA:
  显存 = 冻结权重(P×bpp) + LoRA梯度 + LoRA优化器 + 激活
  LoRA参数 = 2 × target_modules(2) × layers × hidden × rank

QLoRA:
  显存 = INT4权重(P×0.5) + LoRA梯度 + LoRA优化器 + 激活</pre>
<p><b>各列含义：</b></p>
<p><code>Full (AMP+Grad Ckpt)</code> — 全参微调 + 混合精度 + 梯度检查点</p>
<p><code>LoRA</code> — 冻结基座，只训低秩适配层（~2-4% 参数）</p>
<p><code>LoRA + AMP</code> — LoRA + 混合精度（仅 FP32 基座有意义）</p>
<p><code>QLoRA</code> — 4bit 量化基座 + FP16 LoRA 训练，固定 INT4</p>`,

  // 对齐 (DPO)
  `<p><b>DPO 对齐显存估算公式</b></p>
<pre>Full (含 ref, 训练侧固定 AMP):
  显存 = P×2 + P×2 + P×12 + 激活×0.3×2 + logits + P×bpp
       = 训练权重(FP16) + 梯度(FP16) + AdamW优化器(FP32) + 激活(双序列) + logits + ref权重(选定精度)

LoRA (共享基座):
  显存 = P×bpp + loraParams×2 + loraParams×12 + 激活×0.3×2 + logits
       = 基座权重 + LoRA梯度 + LoRA优化器 + 激活(双序列) + logits
  (ref 通过禁用 adapter 实现，不额外占显存)

QLoRA (共享基座):
  显存 = P×0.5 + loraParams×2 + loraParams×12 + 激活×0.3×2 + logits
       = INT4基座 + LoRA梯度 + LoRA优化器 + 激活(双序列) + logits

其中:
  loraParams = 2 × target_modules(2) × layers × hidden × rank
  激活      ≈ 2 × bs × seq_len × hidden × layers × 2 bytes
  logits    = 2 × bs × seq_len × vocab × 4 bytes  (chosen+rejected 各一份 fp32)</pre>
<p><b>注意：</b></p>
<p><code>双序列</code> — DPO 单步要算 chosen + rejected 两份 forward，激活和 logits 都 ×2</p>
<p><code>logits</code> — 大词表是隐藏成本：Qwen2 vocab=151k 时单份 logits 已达 ~1.2 GB（seq=1024），是 LLaMA (32k) 的近 5 倍</p>
<p><code>Full</code> — 需要独立 ref 模型（全参训练无法共享权重），ref 以选定精度加载</p>
<p><code>LoRA / QLoRA</code> — ref = 禁用 adapter 的同一基座，零额外开销（TRL/Unsloth 默认行为）</p>
<p><code>实测偏差</code> — 公式只算"教科书四件套 + logits"，未建模 grad_ckpt 重算开销、logsoftmax/gather 中间张量、CUDA workspace、cuBLAS/NCCL buffer、PyTorch allocator 碎片、trl/peft 栈临时张量。<b>实测峰值通常为表格 3~7×</b>，DPO + 大词表 + 长序列叠加时差距最大（如 Qwen2.5-1.5B QLoRA DPO seq=1024 实测 22 GB）。本表用于判断"量级是否合理"，不用于预测 OOM 边界。</p>`,

  // 部署 (推理)
  `<p><b>推理部署显存估算公式</b></p>
<pre>显存 = 模型权重 + KV Cache

模型权重 = P × bytes_per_param
KV Cache  = 2(K+V) × layers × heads × head_dim × seq_len × bs × 2 bytes</pre>
<p><code>模型权重</code> — 静态占用，取决于参数量和精度</p>
<p><code>KV Cache</code> — 动态占用，随 batch size 和序列长度线性增长</p>
<p>KV Cache 默认以 FP16 存储（与模型精度无关）。</p>`,
];

const overlay = document.getElementById('modal-overlay');
const modalTitle = document.getElementById('modal-title');
const modalBody = document.getElementById('modal-body');

document.getElementById('help-btn').onclick = () => {
  modalTitle.textContent = TABS[activeTab] + ' — 计算说明';
  modalBody.innerHTML = HELP_CONTENT[activeTab];
  overlay.classList.add('open');
};
document.getElementById('modal-close').onclick = () => { overlay.classList.remove('open'); };
overlay.onclick = (e) => { if (e.target === overlay) overlay.classList.remove('open'); };

// === Boot ===
initChips('model-select', Object.keys(MODEL_CONFIGS), DEFAULT_MODELS, 'models');
initChips('precision-select', PRECISIONS, DEFAULT_PRECISIONS, 'precisions');
initSelect('bs-select', BS_OPTIONS, 1, v => { batchSize = v; });
initSelect('seq-select', SEQ_OPTIONS, 2048, v => { seqLen = v; });
initSelect('lora-rank-select', LORA_RANK_OPTIONS, 16, v => { loraRank = v; });
// vocab 选项是 {value, label} 结构，单独初始化
(function initVocabSelect() {
  const sel = document.getElementById('vocab-select');
  VOCAB_OPTIONS.forEach(({ value, label }) => {
    const opt = document.createElement('option');
    opt.value = value;
    opt.textContent = label;
    if (value === vocabSize) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = () => { vocabSize = Number(sel.value); render(); };
})();
initSelect('vram-limit-select', VRAM_LIMIT_OPTIONS, 12, v => { vramLimit = v; }, ' GB');
initTabs();
render();
</script>
